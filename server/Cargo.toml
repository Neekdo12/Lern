[package]
name = "lern"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
shared = { version = "0.1.0", path = "../shared" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
