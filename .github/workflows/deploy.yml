name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        run: command -v trunk || cargo install trunk --locked --version 0.21.14

      - name: Test
        run: cargo test --release

      - name: Build server
        run: cargo build --release

      - name: Build frontend
        run: cd web && trunk build --release

      - name: Package
        run: |
          mkdir -p package/web
          cp target/release/lern package/
          cp -r web/dist package/web/dist

      - uses: actions/upload-artifact@v4
        with:
          name: lern-aarch64
          path: package/

  deploy:
    needs: build
    runs-on: [self-hosted, lern-pi]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lern-aarch64
          path: package

      - name: Install and restart
        run: |
          chmod +x package/lern
          cp package/lern /opt/lern/lern.new
          mv -f /opt/lern/lern.new /opt/lern/lern
          rm -rf /opt/lern/web /opt/lern/public
          mkdir -p /opt/lern/web
          cp -r package/web/dist /opt/lern/web/dist
          sudo systemctl restart lern
          sleep 3
          systemctl is-active lern
